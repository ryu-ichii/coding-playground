<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet" />

    <title>デジタル便所</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>

    <!-- TITLE -->
    <div class="cardTitle">
      <h1>デジタル便所</h1>
      <h5>be comfortable.</h5>

      <div class="cardError">
        <h3>Warning</h3>
        <p class="center">You are not comfortable.</p>
        <hr />
        <button class="buttonNetwork">Retry</button>
      </div>
    </div>

    <!-- POEM -->
    <div class="row">
      <div class="column-wide">
        <div class="card cardPoem">
          <p>Dribble</p>
          <hr />
          <div id="poem"></div>
        </div>
      </div>
    </div>

    <!-- FEATURED + SMALL TILES -->
    <div class="row">

      <!-- FEATURED -->
      <div class="columnL">
        <div class="card cardHaiku">
          <h4>The Bidet</h4>
          <p>in the carnival</p>
          <p>I am a putrid human</p>
          <p>fucked off while shitting</p>
        </div>
      </div>

      <div class="columnL">
        <div class="card cardText">
          <p class="bubble">hi</p>
          <p class="bubble bubble--alt">hey</p>
        </div>
      </div>

      <div class="columnL">
        <div class="card cardDropdown">
          <h2>Medication Plan</h2>
          <select>
            <option>How do you feel?</option>
          </select>
        </div>
      </div>

      <div class="columnL">
        <div class="card cardNotes">
          <p>notes here</p>
        </div>
      </div>

      <div class="columnL">
        <div class="card cardSearch">
          <input type="text" placeholder="Type..." />
        </div>
      </div>

    </div>

  </body>
</html>
